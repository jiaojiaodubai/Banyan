<?xml version="1.0"?>
<html
  id="banyan-bibliography-dialog"
  persist="screenX screenY width height sizemode"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  resizable="true"
>
  <head>
    <title data-l10n-id="bibliography-dialog-title"></title>
    <link rel="localization" href="zotero.ftl" />
    <link rel="localization" href="__addonRef__-bibliographyDialog.ftl" />

    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/zotero.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/overlay.css" />
    <link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css" />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/bibliographyDialog.css"
    />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/richTextEditor.css"
    />

    <script src="chrome://zotero/content/include.js"></script>
    <script src="chrome://zotero/content/customElements.js"></script>
    <script>
      const addon = Zotero.__addonInstance__;
      const ztoolkit = addon.data.ztoolkit;
    </script>
    <script src="chrome://__addonRef__/content/scripts/bibliographyDialog.js"></script>
  </head>

  <body>
    <section id="line-section">
      <div
        class="section-title"
        data-l10n-id="bibliography-dialog-line-section-title"
      ></div>
      <div
        class="section-desc"
        data-l10n-id="bibliography-dialog-line-section-desc"
      ></div>
      <div id="line-editor"></div>
    </section>

    <section id="uncited-section">
      <div
        class="section-title"
        data-l10n-id="bibliography-dialog-uncited-section-title"
      ></div>
      <div
        class="section-desc"
        data-l10n-id="bibliography-dialog-uncited-section-desc"
      ></div>
      <div class="virtualized-table-container">
        <div id="uncited-items-tree"></div>
      </div>
      <div class="btn-group">
        <button
          id="edit-uncited"
          type="button"
          data-l10n-id="bibliography-dialog-uncited-edit"
        ></button>
      </div>
    </section>
  </body>
  <footer>
    <button
      id="accept-button"
      type="button"
      data-l10n-id="bibliography-dialog-accept"
    ></button>
    <button
      id="cancel-button"
      type="button"
      data-l10n-id="bibliography-dialog-cancel"
    ></button>
  </footer>
</html>
