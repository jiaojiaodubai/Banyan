<?xml version="1.0" encoding="utf-8"?>
<html
  id="banyan-creators-ext-dialog"
  persist="screenX screenY width height sizemode"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  width="540"
  height="240"
  resizable="true"
>
  <head>
    <title data-l10n-id="creators-ext-dialog-title"></title>
    <link rel="localization" href="zotero.ftl" />
    <link rel="localization" href="__addonRef__-creatorsExtDialog.ftl" />

    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/zotero.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/overlay.css" />
    <link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css" />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/dialogFooter.css"
    />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/creatorsExtDialog.css"
    />

    <script src="chrome://zotero/content/include.js"></script>
    <script src="chrome://zotero/content/customElements.js"></script>
    <script>
      const addon = Zotero.__addonInstance__;
      const ztoolkit = addon.data.ztoolkit;
    </script>
    <script src="chrome://__addonRef__/content/scripts/creatorsExtDialog.js"></script>
  </head>

  <body>
    <xul:popupset>
      <xul:menupopup id="creator-type-menu" position="after_start" />
    </xul:popupset>
    <main id="workspace">
      <div id="dialog-status" role="status" hidden="true"></div>
      <div id="creators-scroll" class="zotero-item-pane-content">
        <div id="creator-rows"></div>
        <div id="empty-state" hidden="true">
          <span data-l10n-id="creators-ext-empty"></span>
          <button
            id="empty-add-button"
            type="button"
            data-l10n-id="creators-ext-add-creator"
          ></button>
        </div>
      </div>
    </main>
    <footer class="dialog-footer">
      <button
        id="cancel-button"
        type="button"
        data-l10n-id="creators-ext-cancel"
      ></button>
      <button
        id="save-button"
        type="button"
        data-l10n-id="creators-ext-save"
        default="true"
      ></button>
    </footer>
  </body>
</html>
