<?xml version="1.0" encoding="utf-8"?>
<html
  id="banyan-item-field-validator-dialog"
  persist="screenX screenY width height sizemode"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  resizable="true"
>
  <head>
    <title data-l10n-id="item-field-validator-dialog-title"></title>
    <link rel="localization" href="zotero.ftl" />
    <link rel="localization" href="__addonRef__-itemFieldValidatorDialog.ftl" />

    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/zotero.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/overlay.css" />
    <link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css" />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/dialogFooter.css"
    />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/itemFieldValidatorDialog.css"
    />

    <script src="chrome://zotero/content/include.js"></script>
    <script src="chrome://zotero/content/customElements.js"></script>
    <script>
      const addon = Zotero.__addonInstance__;
      const ztoolkit = addon.data.ztoolkit;
    </script>
    <script src="chrome://__addonRef__/content/scripts/itemFieldValidatorDialog.js"></script>
  </head>
  <body>
    <header class="report-header">
      <div id="report-style" class="report-style"></div>
      <div id="report-summary" class="report-summary">
        <div id="report-summary-items"></div>
        <div id="report-summary-checks"></div>
      </div>
    </header>

    <main class="report-main">
      <div
        id="report-tree-container"
        class="virtualized-table-container report-tree-container"
      ></div>
      <section id="report-details" class="report-details" hidden="true">
        <div
          id="report-details-table-container"
          class="report-details-table-container"
        ></div>
        <div
          id="report-details-empty"
          class="report-details-empty"
          hidden="true"
          data-l10n-id="item-field-validator-no-checks"
        ></div>
      </section>
      <div
        id="report-empty"
        class="report-empty"
        hidden="true"
        data-l10n-id="item-field-validator-empty"
      ></div>
    </main>
  </body>
</html>
