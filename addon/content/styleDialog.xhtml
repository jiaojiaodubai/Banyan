<?xml version="1.0" encoding="utf-8"?>
<html
  id="banyan-style-dialog"
  persist="screenX screenY width height sizemode"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  resizable="true"
>
  <head>
    <title data-l10n-id="style-dialog-title"></title>
    <link rel="localization" href="zotero.ftl" />
    <link rel="localization" href="__addonRef__-styleDialog.ftl" />

    <link rel="stylesheet" href="chrome://global/skin/global.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/zotero.css" />
    <link rel="stylesheet" href="chrome://zotero/skin/overlay.css" />
    <link rel="stylesheet" href="chrome://zotero-platform/content/zotero.css" />
    <link
      rel="stylesheet"
      href="chrome://__addonRef__/content/styleDialog.css"
    />

    <script src="chrome://zotero/content/include.js"></script>
    <script src="chrome://zotero/content/customElements.js"></script>
    <script src="chrome://zotero/content/titlebar.js"></script>
    <script>
      const addon = Zotero.__addonInstance__;
      const ztoolkit = addon.data.ztoolkit;
    </script>
    <script src="chrome://__addonRef__/content/scripts/styleDialog.js"></script>
  </head>
  <body>
    <header>
      <xul:search-textbox id="search" data-l10n-id="style-dialog-search" />
    </header>
    <main>
      <div class="virtualized-table-container">
        <div id="table-container"></div>
      </div>
    </main>
    <footer>
      <button
        id="confirm"
        type="button"
        data-l10n-id="style-dialog-confirm"
      ></button>
      <button
        id="import"
        type="button"
        data-l10n-id="style-dialog-import"
      ></button>
    </footer>
  </body>
</html>
